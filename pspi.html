<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Perubahan Sistem Pemerintahan Indonesia: Presidensial ke Parlementer</title>
<style>
:root{
  --page:#EFE6E7; --ctl:#7A1F2B; --ctl-ink:#fff; --muted:#5d4a4d;
  --maroon:#7A1F2B; --dark:#3B0F16; --gold:#E0A526; --tint:#F6EDEE; --ink:#2B2B2B; --rose:#B4505C; --pale:#F1D9DC;
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--page:#17090c; --ctl:#E0A526; --ctl-ink:#3B0F16; --muted:#d9c3c6;}}
:root[data-theme="dark"]{--page:#17090c; --ctl:#E0A526; --ctl-ink:#3B0F16; --muted:#d9c3c6;}
*{box-sizing:border-box;margin:0}
html,body{height:100%}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{background:var(--page);color:var(--ink);font-family:Calibri,"Segoe UI",system-ui,sans-serif;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;overflow:hidden}
.stage{width:min(100vw,calc((100dvh - 80px - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px))*0.5625));aspect-ratio:9/16;container-type:inline-size;position:relative;overflow:hidden;background:#fff;border-radius:2cqw;box-shadow:0 8px 30px rgba(0,0,0,.25)}
.slide{position:absolute;inset:0;display:none;flex-direction:column;padding:8cqw 8cqw 11cqw;gap:3cqw}
.slide.on{display:flex}
.slide.dark{background:var(--dark);color:#fff}
h1,h2{font-family:Cambria,Georgia,serif;line-height:1.15}
h2{font-size:7cqw;color:var(--maroon);text-align:center;padding-bottom:2cqw}
.foot{position:absolute;left:8cqw;right:8cqw;bottom:4cqw;display:flex;justify-content:space-between;font-size:2.6cqw;color:#7a7a7a}
.dark .foot{color:var(--pale)}
.card{background:var(--tint);border-radius:2.5cqw;box-shadow:0 .5cqw 2cqw rgba(0,0,0,.12);display:flex;align-items:center;gap:4cqw;padding:3cqw 4cqw;flex:1;min-height:0}
.ic{flex:none;width:13cqw;height:13cqw;border-radius:50%;background:var(--maroon);display:grid;place-items:center;font-size:6cqw}
.card h3{font-size:4.4cqw;color:var(--maroon);margin-bottom:.8cqw}
.card p{font-size:3.5cqw;line-height:1.35}
.intro{font-size:3.8cqw;color:#666}
.hero{background:var(--maroon);color:#fff;border-radius:2.5cqw;padding:4cqw;text-align:center;display:flex;flex-direction:column;justify-content:center;gap:1.5cqw}
.hero b{font-family:Cambria,Georgia,serif;font-size:9.5cqw;color:var(--gold)}
.hero b.huge{font-size:24cqw;line-height:1}
.hero span{font-size:3.8cqw}
.cmp{flex:1;min-height:0;background:var(--tint);border-radius:2.5cqw;box-shadow:0 .5cqw 2cqw rgba(0,0,0,.12);overflow:hidden;display:flex;flex-direction:column}
.cmp h3{font-size:5cqw;color:#fff;padding:3cqw 4cqw}
.cmp ul{padding:3cqw 4cqw 3cqw 9cqw;font-size:4cqw;line-height:1.3;display:flex;flex-direction:column;gap:2cqw}
.tl{flex:1;min-height:0;display:flex;border-radius:2.5cqw;overflow:hidden;background:var(--tint);box-shadow:0 .5cqw 2cqw rgba(0,0,0,.12)}
.tl .d{flex:none;width:25cqw;background:var(--maroon);color:#fff;font-weight:700;font-size:3.9cqw;display:grid;place-items:center;text-align:center;padding:2cqw}
.tl.end .d{background:var(--dark);color:var(--gold)}
.tl div:last-child{padding:2.5cqw 4cqw;align-self:center}
.tl h3{font-size:4.4cqw;color:var(--maroon);margin-bottom:.8cqw}
.tl p{font-size:3.5cqw;line-height:1.3}
.tl{cursor:pointer}
.tl:focus-visible,.x:focus-visible{outline:3px solid var(--gold);outline-offset:-3px}
.tl .d{display:flex;flex-direction:column;justify-content:center;align-items:center;gap:1.2cqw}
.tl .d small{font-size:2.9cqw;font-weight:400;opacity:.85}
.modal{position:absolute;inset:0;background:rgba(20,5,8,.62);display:none;align-items:flex-end;z-index:5}
.modal.open{display:flex}
.sheet{position:relative;background:#fff;color:var(--ink);width:100%;max-height:90%;border-radius:4cqw 4cqw 0 0;padding:6cqw 6cqw 7cqw;display:flex;flex-direction:column}
.mb{overflow-y:auto;padding-right:1cqw}
.x{position:absolute;top:3cqw;right:3.5cqw;width:9cqw;height:9cqw;border:0;border-radius:50%;background:var(--tint);color:var(--maroon);font-size:6cqw;line-height:1;cursor:pointer}
.mdate{display:inline-block;background:var(--maroon);color:#fff;font-weight:700;font-size:3.5cqw;padding:1cqw 3cqw;border-radius:5cqw;margin-bottom:2.5cqw}
.mb h3{font-family:Cambria,Georgia,serif;font-size:6.2cqw;line-height:1.2;color:var(--maroon);margin-bottom:2cqw;padding-right:9cqw}
.mb h4{font-size:4cqw;color:var(--rose);margin:3.2cqw 0 1cqw}
.mb p,.mb li{font-size:3.7cqw;line-height:1.45}
.mb ul{padding-left:5cqw;display:flex;flex-direction:column;gap:1cqw}
.note{background:var(--dark);color:#fff;border-radius:2.5cqw;padding:4cqw;font-size:4cqw;line-height:1.35}
.note b{display:block;color:var(--gold);font-size:5cqw;margin-bottom:1.5cqw}
.cover{justify-content:center;gap:4cqw}
.cover .badge{width:17cqw;height:17cqw;border-radius:50%;background:var(--gold);display:grid;place-items:center;font-size:9cqw}
.cover .tag{color:var(--gold);font-weight:700;font-size:4.2cqw}
.cover h1{font-size:12.5cqw;color:#fff}
.cover h1+p{font-family:Cambria,Georgia,serif;font-style:italic;font-size:6.5cqw;color:var(--pale)}
.cover::before{content:"";position:absolute;right:-18cqw;bottom:-12cqw;width:75cqw;height:75cqw;border-radius:50%;background:var(--gold);opacity:.2}
.cover::after{content:"";position:absolute;left:-20cqw;bottom:-22cqw;width:80cqw;height:80cqw;border-radius:50%;background:var(--maroon);opacity:.65;z-index:0}
.cover>*{position:relative;z-index:1}
.sum{flex:none;display:flex;align-items:center;background:var(--maroon);border-radius:2.5cqw;padding:3.2cqw 4cqw;gap:4cqw}
.sum b{flex:none;width:21cqw;color:var(--gold);font-size:4.6cqw}
.sum span{font-size:4.1cqw}
.q h3{font-family:Cambria,Georgia,serif;font-size:6.5cqw;color:var(--gold);margin:3cqw 0 2cqw}
.q ul{padding-left:6cqw;font-size:4.2cqw;line-height:1.35;color:var(--pale);display:flex;flex-direction:column;gap:2cqw}
.nav{display:flex;align-items:center;gap:14px;height:44px}
.nav button{font:inherit;font-weight:700;border:0;border-radius:22px;padding:0 20px;height:44px;background:var(--ctl);color:var(--ctl-ink);cursor:pointer}
.nav button:disabled{opacity:.35;cursor:default}
.nav button:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.nav span{min-width:56px;text-align:center;color:var(--muted);font-weight:700}
</style>
</head>
<body>
<main class="stage" id="stage" aria-live="polite"></main>
<nav class="nav" aria-label="Navigasi slide">
  <button id="prev" aria-label="Slide sebelumnya">Sebelumnya</button>
  <span id="pos">1 / 9</span>
  <button id="next" aria-label="Slide berikutnya">Berikutnya</button>
</nav>
<script>
const row=(ic,h,b)=>`<div class="card"><div class="ic">${ic}</div><div><h3>${h}</h3><p>${b}</p></div></div>`;
const cmp=(c,t,items)=>`<div class="cmp"><h3 style="background:${c}">${t}</h3><ul>${items.map(i=>`<li>${i}</li>`).join("")}</ul></div>`;
const tl=(d,h,b,end)=>`<div class="tl${end?" end":""}" tabindex="0" role="button" data-k="${d}" aria-label="Buka penjelasan lengkap: ${h}"><div class="d"><span>${d}</span><small>Ketuk ›</small></div><div><h3>${h}</h3><p>${b}</p></div></div>`;
const S=[
 {dark:1,cls:"cover",html:`<div class="badge">🏛️</div><div class="tag">PPKn | Kelas 8 SMP</div><h1>Perubahan Sistem Pemerintahan Indonesia</h1><p>dari Presidensial ke Parlementer</p><div class="tag" style="color:var(--pale);font-weight:400;font-size:3.6cqw">Periode 1945–1959</div>`},
 {t:"Tujuan Pembelajaran",html:`<p class="intro">Setelah mempelajari materi ini, kamu mampu:</p>${row("⚖️","Membedakan","Ciri sistem presidensial dan sistem parlementer.")}${row("📜","Menjelaskan","Latar belakang dan peristiwa perubahan sistem pemerintahan tahun 1945.")}${row("💡","Menganalisis","Dampak sistem parlementer dan alasan kembali ke presidensial.")}`},
 {t:"Presidensial vs Parlementer",html:cmp("var(--maroon)","Sistem Presidensial",["Presiden = kepala negara sekaligus kepala pemerintahan","Menteri bertanggung jawab kepada Presiden","Presiden tidak mudah dijatuhkan parlemen","Masa jabatan eksekutif tetap"])+cmp("var(--rose)","Sistem Parlementer",["Kepala negara dan kepala pemerintahan (Perdana Menteri) terpisah","Menteri bertanggung jawab kepada parlemen","Kabinet bisa jatuh lewat mosi tidak percaya","Kabinet dibentuk oleh partai pemenang di parlemen"])},
 {t:"Awal Kemerdekaan: Sistem Presidensial",html:`<div class="hero"><b>18 Agustus 1945</b><span>PPKI mengesahkan UUD 1945 dan memilih Presiden serta Wakil Presiden</span></div>${row("👤","Presiden Soekarno","Memegang kekuasaan sebagai kepala negara dan kepala pemerintahan.")}${row("👥","Para menteri","Menjadi pembantu Presiden dan bertanggung jawab kepada Presiden.")}${row("🔨","KNIP","Membantu Presiden selama MPR dan DPR belum terbentuk.")}`},
 {t:"Titik Balik: Dua Maklumat 1945",html:`${row("📝","16 Oktober 1945","Maklumat Wakil Presiden No. X: KNIP diberi kekuasaan legislatif dan ikut menetapkan Garis-Garis Besar Haluan Negara.")}${row("🚩","14 November 1945","Maklumat Pemerintah: menteri bertanggung jawab kepada KNIP (parlemen). Sutan Sjahrir menjadi Perdana Menteri pertama.")}<div class="note"><b>Mengapa berubah?</b>Pemerintah ingin menunjukkan kepada dunia bahwa Indonesia adalah negara demokratis, bukan bentukan Jepang, sehingga kemerdekaan lebih mudah diakui.</div>`},
 {t:"Perjalanan Sistem Parlementer",html:tl("14 Nov 1945","Parlementer dimulai","Menteri bertanggung jawab kepada KNIP; Sjahrir menjadi PM pertama.")+tl("27 Des 1949","Konstitusi RIS","Negara serikat (federal) dengan PM Mohammad Hatta.")+tl("17 Agu 1950","UUDS 1950","Kembali negara kesatuan; sistem parlementer berlanjut.")+tl("1955","Pemilu pertama","Rakyat memilih anggota DPR dan Konstituante.")+tl("5 Juli 1959","Dekrit Presiden","UUD 1945 berlaku lagi; sistem presidensial kembali.",1)},
 {t:"Masa Demokrasi Liberal",html:`<div class="hero"><b class="huge">7</b><span>kabinet silih berganti dalam sekitar 9 tahun (1950–1959)</span></div>${row("🗳️","Banyak partai","Partai bersaing tajam sehingga sulit membentuk kabinet yang kuat.")}${row("🔄","Kabinet jatuh bangun","Mosi tidak percaya membuat program kerja tidak sempat selesai.")}${row("📉","Pembangunan terhambat","Politik tidak stabil dan pemerintah sulit fokus pada ekonomi.")}`},
 {t:"Kembali ke Presidensial: Dekrit 5 Juli 1959",html:`<p class="intro"><b>Penyebab:</b> Konstituante gagal menyusun UUD baru dan kabinet tidak stabil sehingga negara terancam perpecahan.</p>${row("✅","Konstituante dibubarkan","Lembaga pembuat UUD dihentikan.")}${row("📖","UUD 1945 berlaku lagi","UUDS 1950 tidak berlaku.")}${row("🏛️","MPRS dan DPAS dibentuk","Lembaga negara sementara disiapkan.")}<div class="note">Hasilnya: Presiden kembali menjadi kepala negara dan kepala pemerintahan (Demokrasi Terpimpin).</div>`},
 {dark:1,t:"Rangkuman",html:`<div class="sum"><b>1945</b><span>Presidensial lewat UUD 1945</span></div><div class="sum"><b>Nov 1945</b><span>Maklumat membuka jalan sistem parlementer</span></div><div class="sum"><b>1950–1959</b><span>Kabinet sering jatuh, politik tidak stabil</span></div><div class="sum"><b>1959</b><span>Dekrit: kembali ke presidensial</span></div><div class="q"><h3>Diskusi kelas</h3><ul><li>Mengapa sistem parlementer sulit berjalan stabil pada masa itu?</li><li>Apa kelebihan sistem presidensial bagi stabilitas pemerintahan?</li></ul></div>`}
];
const DETAIL={
"14 Nov 1945":{t:"Maklumat Pemerintah dan Kabinet Sjahrir I",s:[
["Apa yang terjadi","Pada 14 November 1945 pemerintah mengumumkan bahwa menteri tidak lagi hanya bertanggung jawab kepada Presiden, tetapi kepada parlemen (KNIP dan Badan Pekerjanya). Pada hari itu Sutan Sjahrir diangkat sebagai Perdana Menteri dan membentuk Kabinet Sjahrir I, kabinet parlementer pertama di Indonesia."],
["Latar belakang","Sebelumnya, Maklumat Wakil Presiden No. X (16 Oktober 1945) memberi KNIP kekuasaan legislatif dan hak ikut menetapkan Garis-Garis Besar Haluan Negara. Pemerintah juga ingin menunjukkan kepada dunia, terutama Sekutu dan Belanda, bahwa Indonesia adalah negara demokratis dan bukan bentukan Jepang."],
["Dampak","Presiden Soekarno menjadi kepala negara, sedangkan tugas menjalankan pemerintahan dipegang Perdana Menteri. Perubahan ini dilakukan lewat maklumat tanpa mengubah teks UUD 1945, sehingga dinilai sebagai penyimpangan dari UUD 1945 yang menganut sistem presidensial."]]},
"27 Des 1949":{t:"Konstitusi RIS 1949",s:[
["Apa yang terjadi","Setelah Konferensi Meja Bundar (KMB) di Den Haag, Belanda menyerahkan kedaulatan pada 27 Desember 1949. Indonesia berubah menjadi Republik Indonesia Serikat (RIS) dengan Konstitusi RIS sebagai dasar hukum."],
["Ciri-ciri","<ul><li>Bentuk negara serikat (federal) yang terdiri atas negara-negara bagian.</li><li>Sistem pemerintahan parlementer: kabinet bertanggung jawab kepada parlemen (DPR dan Senat RIS).</li><li>Soekarno menjadi Presiden RIS dan Mohammad Hatta menjadi Perdana Menteri.</li></ul>"],
["Dampak","Banyak rakyat menilai bentuk federal sebagai warisan Belanda yang memecah persatuan. Muncul tuntutan kuat agar Indonesia kembali menjadi negara kesatuan."]]},
"17 Agu 1950":{t:"UUDS 1950 dan Demokrasi Liberal",s:[
["Apa yang terjadi","Negara-negara bagian satu per satu bergabung dengan Republik Indonesia. Pada 17 Agustus 1950, RIS dibubarkan dan Indonesia kembali menjadi Negara Kesatuan Republik Indonesia (NKRI) dengan Undang-Undang Dasar Sementara (UUDS) 1950."],
["Ciri-ciri","<ul><li>Sistem pemerintahan parlementer dengan Perdana Menteri sebagai kepala pemerintahan.</li><li>Presiden Soekarno menjadi kepala negara dengan kekuasaan terbatas.</li><li>Banyak partai politik dan kebebasan berpolitik yang luas, sehingga masa ini disebut Demokrasi Liberal.</li><li>Kabinet pertama masa ini ialah Kabinet Natsir (September 1950).</li></ul>"],
["Catatan","UUDS bersifat sementara. Tugas menyusun UUD tetap diserahkan kepada Konstituante hasil pemilu."]]},
"1955":{t:"Pemilu 1955",s:[
["Apa yang terjadi","Pemilu pertama Indonesia berlangsung dua tahap: 29 September 1955 untuk memilih anggota DPR dan 15 Desember 1955 untuk memilih anggota Konstituante."],
["Ciri-ciri","Pemilu diikuti banyak partai, dengan empat partai besar: PNI, Masyumi, NU, dan PKI. Pemilu ini dikenang berlangsung aman dan demokratis."],
["Dampak","Tidak ada partai yang menang mutlak, sehingga kabinet tetap harus dibentuk dari koalisi beberapa partai. Pertentangan antarpartai berlanjut dan kabinet masih mudah jatuh."]]},
"5 Juli 1959":{t:"Dekrit Presiden 5 Juli 1959",s:[
["Apa yang terjadi","Pada 5 Juli 1959 Presiden Soekarno mengeluarkan dekrit untuk mengakhiri kebuntuan politik."],
["Latar belakang","Konstituante gagal menyusun UUD baru karena tidak mencapai kesepakatan dan kuorum. Kabinet silih berganti dan muncul gejolak di daerah, sehingga negara dinilai terancam perpecahan."],
["Isi dekrit","<ul><li>Membubarkan Konstituante.</li><li>Memberlakukan kembali UUD 1945 dan menyatakan UUDS 1950 tidak berlaku.</li><li>Membentuk MPRS dan DPAS dalam waktu singkat.</li></ul>"],
["Dampak","Sistem pemerintahan kembali presidensial: Presiden menjadi kepala negara sekaligus kepala pemerintahan. Masa ini dikenal sebagai Demokrasi Terpimpin."]]}
};
const stage=document.getElementById("stage"),pos=document.getElementById("pos"),prev=document.getElementById("prev"),next=document.getElementById("next");
S.forEach((s,i)=>{const e=document.createElement("section");e.className="slide"+(s.dark?" dark":"")+(s.cls?" "+s.cls:"");
 e.innerHTML=(s.t?`<h2${s.dark?' style="color:var(--gold);text-align:left"':""}>${s.t}</h2>`:"")+s.html+(i?`<div class="foot"><span>Sistem Pemerintahan Indonesia | Kelas 8</span><span>${i+1}</span></div>`:"");
 stage.appendChild(e)});
const slides=[...stage.children];let cur=0;
const modal=document.createElement("div");modal.className="modal";modal.setAttribute("role","dialog");modal.setAttribute("aria-modal","true");
modal.innerHTML='<div class="sheet"><button class="x" aria-label="Tutup penjelasan">×</button><div class="mb"></div></div>';
stage.appendChild(modal);
const mb=modal.querySelector(".mb"),xb=modal.querySelector(".x");let lastFocus=null;
function openM(k){const D=DETAIL[k];if(!D)return;lastFocus=document.activeElement;
 mb.innerHTML='<div class="mdate">'+k+'</div><h3>'+D.t+'</h3>'+D.s.map(a=>'<h4>'+a[0]+'</h4>'+(a[1].startsWith('<ul>')?a[1]:'<p>'+a[1]+'</p>')).join('');
 mb.scrollTop=0;modal.classList.add("open");xb.focus()}
function closeM(){if(!modal.classList.contains("open"))return;modal.classList.remove("open");if(lastFocus&&lastFocus.focus)lastFocus.focus()}
xb.onclick=closeM;modal.addEventListener("click",e=>{if(e.target===modal)closeM()});
modal.addEventListener("touchstart",e=>e.stopPropagation(),{passive:true});
stage.addEventListener("click",e=>{const t=e.target.closest&&e.target.closest(".tl");if(t)openM(t.dataset.k)});
function go(n,push){closeM();cur=Math.max(0,Math.min(slides.length-1,n));slides.forEach((e,i)=>e.classList.toggle("on",i===cur));
 pos.textContent=(cur+1)+" / "+slides.length;prev.disabled=cur===0;next.disabled=cur===slides.length-1;
 if(push!==false){try{history.replaceState(null,"","#s"+(cur+1))}catch(e){}}}
prev.onclick=()=>go(cur-1);next.onclick=()=>go(cur+1);
addEventListener("keydown",e=>{if(modal.classList.contains("open")){if(e.key==="Escape")closeM();return}
 if(e.key==="Enter"&&document.activeElement&&document.activeElement.classList.contains("tl")){openM(document.activeElement.dataset.k);return}
 if(["ArrowRight","ArrowDown","PageDown"," "].includes(e.key)){e.preventDefault();go(cur+1)}if(["ArrowLeft","ArrowUp","PageUp"].includes(e.key)){e.preventDefault();go(cur-1)}});
let x0=null;stage.addEventListener("touchstart",e=>x0=e.touches[0].clientX,{passive:true});
stage.addEventListener("touchend",e=>{if(x0===null)return;const d=e.changedTouches[0].clientX-x0;if(Math.abs(d)>40)go(cur+(d<0?1:-1));x0=null});
const m=/^#s(\d+)$/.exec(location.hash);go(m?+m[1]-1:0,false);
</script>
</body>
</html>
